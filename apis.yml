name: Parative
description: 'Parative was an AI-powered customer intelligence / customer behavior platform (founded 2017,
  Boston, MA) that surfaced product-usage signals to define ICP fit, forecast net revenue retention, and
  predict churn, renewal, and expansion for go-to-market and customer success teams. It was surfaced in
  the API Evangelist network as a portfolio company of bain-capital-ventures (sector: ai-apps). Parative
  was acquired by Totango on 2024-10-22 and no longer operates independently; its domain parative.com no
  longer resolves (no DNS/NS records) and it exposes no reachable public API, developer portal, or
  documentation surface. Its product API was never public: an Amplify config embedded in the
  company''s own published npm package shows the backend was a private AWS AppSync GraphQL
  endpoint (us-west-2, Cognito User Pools auth) serving its React web client, and that endpoint
  no longer resolves either. One first-party artifact outlives the domain — the npm package
  @parative/library, the compiled front-end of the Parative app, last published 2024-08-07.
  This profile is retained as a historical company record.'
