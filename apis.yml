  detail: >-
    Parative's team and technology were acquired by Totango on 2024-10-22 and folded into
    Totango's Unison churn-intelligence line, and the company has since been fully
    decommissioned rather than redirected — parative.com still holds an active registration
    delegating to four Route 53 nameservers, but the hosted zone behind it is gone, so every
    host (apex, www, api, docs, developer, app) returns SERVFAIL and no HTTP connection can
    be opened at all; the only surviving first-party artifact is the npm package
    @parative/library, whose publishing stopped on 2024-08-07, ten weeks before the
    acquisition was announced.
